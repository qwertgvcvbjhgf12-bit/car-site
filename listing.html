<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarScout Listing</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="logo" href="/">CAR<span>SCOUT</span></a></header><main class="section"><div id="listing"></div></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/listings/'+id).then(r=>r.json()).then(v=>{document.title=`${v.year} ${v.make} ${v.model} | CarScout`;document.getElementById('listing').innerHTML=`<p class="eyebrow">LISTING</p><h1>${v.year} ${v.make} ${v.model} ${v.trim}</h1><div class="listing"><div class="bigcar">${v.image}</div><div><h2>$${v.price.toLocaleString()}</h2><p>${v.mileage.toLocaleString()} miles · ${v.city}, ${v.state}</p><p>Combined MPG: ${v.mpg}</p><p>Dealer: ${v.dealer}</p><p>VIN: ${v.vinMasked}</p><a class="button" href="${v.url}">View seller listing</a></div></div>`})</script></body></html>
